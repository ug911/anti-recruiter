<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Auth Callback</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      margin: 0;
      background: #f8f9fa;
    }
    .container {
      text-align: center;
      padding: 40px 20px;
      max-width: 300px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 20px;
      border: 4px solid #e9ecef;
      border-top-color: #7c83fd;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    p {
      color: #495057;
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
    }
    .error {
      color: #fa5252;
    }
    .debug {
      font-size: 11px;
      color: #868e96;
      margin-top: 10px;
      word-break: break-all;
      max-height: 100px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <p id="status">Processing authentication...</p>
    <div class="debug" id="debug"></div>
  </div>
  <script src="callback.js"></script>
</body>
</html>
