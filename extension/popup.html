<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talendly Assistant</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <img src="logo.png" alt="Talendly Logo" width="28">
        </div>
        <div>
          <h1>Talendly</h1>
          <span class="subtitle">AI Hiring Assistant</span>
        </div>
      </div>
      <div class="header-right">
        <div class="status-dot" id="statusDot" title="Backend connected"></div>
        <div id="userMenu" class="user-menu hidden">
          <button class="user-btn" id="userBtn" title="User menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </button>
          <div id="userDropdown" class="dropdown hidden">
            <div class="user-info">
              <div id="userName" class="user-name"></div>
              <div id="userEmail" class="user-email"></div>
            </div>
          </div>
        </div>
        <button id="loginBtn" class="login-btn hidden">Login</button>
      </div>
    </header>

    <!-- Login Iframe Screen -->
    <div id="loginScreen" class="login-screen hidden">
      <iframe id="loginIframe" class="login-iframe" title="Login"></iframe>
    </div>
    </header>

    <!-- Chat Area -->
    <div class="chat-area" id="chatArea">
      <div class="message bot-message">
        <div class="message-avatar">
          <img src="logo.png" alt="T" width="18">
        </div>
        <div class="message-content">
          <p>Wassup! I'm your Talendly assistant. Ready to help you find the best talent.</p>
          <p class="hint">Try: <em>"Post a Senior React Dev in Bangalore"</em></p>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="messageInput" placeholder="Describe the job you want to post..." rows="1" autofocus></textarea>
        <button id="sendBtn" class="send-btn" title="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <script src="marked.min.js"></script>
  <script src="popup.js"></script>
</body>

</html>
